<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>CSS Styling με classlist</title>

    <style>
      .outer {
        width: 90%;
        border: 1px solid black;
        margin-left: auto;
        margin-right: auto;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sapiente qui
        possimus veritatis et laborum excepturi iste, quibusdam incidunt
        consequuntur quae provident deserunt, quasi repudiandae repellendus,
        praesentium rem fugiat suscipit magni.
      </p>
    </div>

    <script>
      const container = document.getElementById("container");
      container.classList.add("outer");
    </script>
  </body>
</html>
